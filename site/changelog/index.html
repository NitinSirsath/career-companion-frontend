<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog · NorthList</title>
<meta name="description" content="Everything that changed in NorthList, newest first.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="changelog">
<div data-site-header></div>
<main class="pr-main">

  <!-- 1. Title left, as on Pricing -->
  <section class="wrap pr-hero" aria-labelledby="cl-title">
    <h1 id="cl-title" class="pr-display rv pr-blur">What’s new.</h1>
    <div class="pr-hero-row rv">
      <p class="pr-lead">Everything that changed in NorthList, newest first.</p>
    </div>
  </section>

  <!-- 2. Releases (Linear's changelog): a date column, then the entry; some entries show the one piece they changed -->
  <section class="wrap pr-log-band" aria-label="Releases">
    <div class="pr-log" data-changelog></div>
  </section>

  <!-- 3. Close -->
  <section class="wrap pr-close">
    <div class="pr-close-in rv">
      <h2 class="pr-close-title">Try what’s new.</h2>
      <div class="pr-close-act"><div class="pr-ctas"><a class="btn btn-primary btn-lg" href="https://app.northlist.site/login">Start free</a><a class="btn btn-secondary btn-lg" href="https://app.northlist.site/login">Sign in</a></div><p>Free while in beta, for the first 99 accounts.</p></div>
    </div>
  </section>

</main>
<div data-site-footer></div>
<script type="module" src="/main.ts"></script>
