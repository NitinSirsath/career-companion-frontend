<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NorthList Apply setup</title>
<meta name="description" content="Set up NorthList Apply: add your resume, check what your AI read, and answer the rest in a few taps.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/apply-onboard.css">
<link rel="stylesheet" href="/styles/apply-logo.css">
<!-- Light or dark before the first paint: light unless the user picked dark on this computer -->
<script>try { if (localStorage.getItem('nl-apply-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}</script>
</head>
<body>
<!--
  The setup page of NorthList Apply (owner, 23 Nov 2026; clean light look, 24 Nov). The user's AI opens it
  (instructions/setup_page.md): the resume facts come after "#", the user answers, and the AI reads the
  answers back from this page's text. Nothing is sent anywhere.
-->
<header class="top">
  <a class="logo" href="/"><i data-wordmark="18"></i><span class="logo-app">Apply</span></a>
  <div class="top-right"><span class="top-note" id="top-note"></span><button type="button" class="theme" id="theme" aria-label="Switch to dark mode"></button></div>
</header>
<div class="progress" role="presentation"><i><b id="bar"></b></i></div>
<main><form class="step" id="step" novalidate></form></main>
<script type="module" src="/apply/setup/setup.ts"></script>
</body>
</html>
