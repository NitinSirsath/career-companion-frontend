    --green-bg: #a7f0ba; --green: #044317;

  }
  @media (prefers-color-scheme: dark) {
    :root {

  * { box-sizing: border-box; }
  body {
    margin: 0;

    color: var(--text-primary);

    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
  .wordmark { display: inline-block; font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; color: var(--text-primary); }
  .wordmark svg { display: inline-block; width: 0.57em; height: 0.57em; margin: 0 -0.031em 0 0.011em; vertical-align: -0.017em; fill: var(--mark); }

  header { display: flex; align-items: stretch; height: 56px; border-bottom: 1px solid var(--border-subtle); }
  header .home { flex: 1; display: flex; align-items: center; padding: 0 20px; }
  header .home:hover { text-decoration: none; }
  header .signin { display: flex; align-items: center; padding: 0 20px; border-left: 1px solid var(--border-subtle); color: var(--text-primary); }
  header .signin:hover { background: var(--layer-hover); color: var(--text-primary); text-decoration: none; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 72px 48px; }

  /* "404" on a 19 × 7 grid: 5 columns per digit, 2 empty columns between. */
  .tiles { display: grid; grid-template-columns: repeat(19, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 880px; margin-bottom: 44px; }
  .tiles i, .tiles b { aspect-ratio: 1; }
  .tiles i { border: 1px solid var(--border-subtle); opacity: 0.6; }
  /* A lit tile is a tiny mail: three lines, each shorter than the one above. */
  .tiles b {
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--fg), var(--fg)),
      linear-gradient(color-mix(in srgb, var(--fg) 70%, transparent), color-mix(in srgb, var(--fg) 70%, transparent)),
      linear-gradient(color-mix(in srgb, var(--fg) 50%, transparent), color-mix(in srgb, var(--fg) 50%, transparent));
    background-size: 76% 10%, 58% 10%, 40% 10%;
    background-position: 12% 28%, 12% 50%, 12% 72%;
    background-repeat: no-repeat;
    opacity: 0;
    animation: sort-in 420ms cubic-bezier(0, 0, 0.38, 0.9) forwards;
    animation-delay: calc(120ms + var(--n) * 40ms);
  }
  .b { --bg: var(--blue-bg); --fg: var(--blue); }
  .c { --bg: var(--cyan-bg); --fg: var(--cyan); }
  .t { --bg: var(--teal-bg); --fg: var(--teal); }
  .g { --bg: var(--green-bg); --fg: var(--green); }
  .y { --bg: var(--yellow-bg); --fg: var(--yellow); }
  .m { --bg: var(--mark); --fg: #ffffff; }
  /* Sorted in one by one, like mails the AI has read. */
  @keyframes sort-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tiles b { animation: none; opacity: 1; } }

  .code { margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; line-height: 16px; letter-spacing: 0.02em; color: var(--text-tertiary); }
  h1 { margin: 8px 0 0; font-size: 48px; line-height: 56px; font-weight: 400; letter-spacing: -0.02em; }
  .lead { margin: 16px auto 0; max-width: 560px; font-size: 18px; line-height: 28px; color: var(--text-secondary); }
  .button {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 48px; margin-top: 32px;
    height: 48px; padding: 0 16px; background: var(--button); color: #ffffff; font-size: 14px;
  }
  .button:hover { background: var(--button-hover); color: #ffffff; text-decoration: none; }
  .button svg { width: 16px; height: 16px; fill: currentColor; }
  .moved { margin: 16px 0 0; font-size: 13px; line-height: 18px; color: var(--text-secondary); }
  .moved b { color: var(--text-primary); font-weight: 600; }

  footer { border-top: 1px solid var(--border-subtle); }
  footer div { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; max-width: 1184px; margin: 0 auto; padding: 24px 48px 32px; }
  footer .copy { font-size: 12px; color: var(--text-secondary); }
  footer .links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-left: auto; font-size: 12px; }

  @media (max-width: 640px) {
    main { padding: 40px 16px 48px; }
    .tiles { gap: 2px; margin-bottom: 28px; }
    h1 { font-size: 32px; line-height: 40px; }
    .lead { font-size: 16px; line-height: 24px; }
    .button { align-self: stretch; }
    footer div { padding: 24px 16px 32px; }
    footer .links { margin-left: 0; }
  }
</style>
