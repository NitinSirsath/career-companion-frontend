name: Finish northlist-logo once (temporary)
# Adds the reviewed image files and deletes files on feat/northlist-logo, and commits only that.
# Lives only on the throwaway branch tmp/northlist-logo-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/northlist-logo-finish]
permissions:
  contents: write
concurrency:
  group: finish-northlist-logo-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/northlist-logo
      - name: Check the hand commits
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "d607cf4a17e763b46ae55055f50f55accbcb613a" ]; then
            echo "The hand commits do not match the reviewed files. Nothing was changed."
            exit 1
          fi
