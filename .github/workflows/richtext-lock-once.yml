name: Rich text lock file once (temporary)
# Commits the reviewed change on feat/rich-text-reply and nothing else.
# Lives only on the throwaway branch tmp/richtext-lock, which is deleted afterwards.
on:
  push:
    branches: [tmp/richtext-lock]
permissions:
  contents: write
concurrency:
  group: richtext-lock-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rich-text-reply
      - name: Check the branch
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "a8cb4d82617c30cda6e5c503dd9b8694a41493ba" ]; then
            echo "feat/rich-text-reply is not at the expected commit. Nothing was changed."
            exit 1
          fi
      - name: Apply the reviewed change
