name: Finish installable-app once (temporary)
# Adds the reviewed image files on feat/installable-app, and commits only that.
# Lives only on the throwaway branch tmp/installable-app-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/installable-app-finish]
permissions:
  contents: write
concurrency:
  group: finish-installable-app-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/installable-app
      - name: Check the hand commits
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "8c8efe14bcb217c2655f2dd835857673388cc7c1" ]; then
            echo "The hand commits do not match the reviewed files. Nothing was changed."
            exit 1
          fi
