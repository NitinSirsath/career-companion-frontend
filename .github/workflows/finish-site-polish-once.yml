name: Finish site-polish once (temporary)
# Commits the deleted files on feat/site-polish and nothing else.
# Lives only on the throwaway branch tmp/site-polish-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/site-polish-finish]
permissions:
  contents: write
concurrency:
  group: finish-site-polish-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/site-polish
      - name: Check the commits on the branch
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "2ff3f0abb0e839badd4a204a43c127fb871a02e6" ]; then
            echo "The commits on feat/site-polish do not match the reviewed files. Nothing was changed."
            exit 1
          fi
      - name: Make the reviewed change
        run: |
          git rm -q site/about/bengaluru-night-1280.jpg
          git rm -q site/about/bengaluru-night.jpg
          git add -A
          if [ "$(git write-tree)" != "1462c011aabee56674f2e3031893aa72e588495e" ]; then
            echo "The result does not match the reviewed tree. Nothing was pushed."
            git status --short
            exit 1
          fi
      - name: Commit only the reviewed result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(site): delete the old About photo'
          git push origin HEAD:feat/site-polish
