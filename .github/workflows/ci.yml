name: CI
on:
  # A branch runs CI through its pull request only. A push run on a branch could be cancelled on a
  # stacked branch that starts from the same commit, and hide the run its pull request needs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily at 07:00 IST: catches backend contract changes while no frontend PR is open.
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: read
# A newer run of the same kind on the same branch cancels the older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # The daily run only compares contracts.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: frontend
      - uses: actions/checkout@v7
        with:
          repository: NitinSirsath/career-companion-backend
          ref: main
          path: career-companion-backend
      - name: Compare backend-authored contracts
        run: |
          diff -r career-companion-backend/src/contracts frontend/src/contracts || {
            echo 'Frontend contracts differ from backend main. Run npm run sync-contracts and commit.'
            exit 1
          }
