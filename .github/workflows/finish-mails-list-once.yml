name: Finish mails-list once (temporary)
# Applies the reviewed second half of the Mails list to feat/mails-list and commits only that.
# Lives only on the throwaway branch tmp/mails-list-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/mails-list-finish]
permissions:
  contents: write
concurrency:
  group: finish-mails-list-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mails-list
      - name: Check the starting point
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "80beb3bbdebf3c680bd617aae8a14ea7d7f6ee33" ]; then
            echo "feat/mails-list is not where the reviewed change starts. Nothing was changed."
            exit 1
          fi
      - name: Apply the reviewed change
        run: |
          git apply --unidiff-zero <<'PATCH'
