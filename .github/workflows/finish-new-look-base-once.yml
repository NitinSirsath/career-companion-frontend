name: Finish new-look-base once (temporary)
# Commits the lock file on feat/new-look-base and nothing else.
# Lives only on the throwaway branch tmp/new-look-base-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/new-look-base-finish]
permissions:
  contents: write
concurrency:
  group: finish-new-look-base-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/new-look-base
      - name: Check the commits on the branch
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "bd03ff03719de28e333c3cf1eb925db59f2e3ad7" ]; then
            echo "The commits on feat/new-look-base do not match the reviewed files. Nothing was changed."
            exit 1
          fi
      - name: Make the reviewed change
        run: |
          cat > /tmp/change.diff <<'PATCH'
          diff --git a/package-lock.json b/package-lock.json
          index 4e16fd1..4bf35bc 100644
          --- a/package-lock.json
          +++ b/package-lock.json
          @@ -12 +11,0 @@
          -        "@carbon/icons-react": "^11.90.0",
          @@ -31,0 +31 @@
          +        "lucide-react": "^1.72.0",
          @@ -446,25 +445,0 @@
          -    "node_modules/@carbon/icon-helpers": {
          -      "version": "10.84.0",
          -      "resolved": "https://registry.npmjs.org/@carbon/icon-helpers/-/icon-helpers-10.84.0.tgz",
          -      "integrity": "sha512-G+LVR42568CbluBzu7uV+ZMmI5tT2ojnWCmRgDB8Z3xKls1D5DU6fQHyiAg10JjLo+zBGUih6eEVSCqq9oXkEw==",
          -      "hasInstallScript": true,
          -      "license": "Apache-2.0",
          -      "dependencies": {
          -        "@ibm/telemetry-js": "^1.5.0"
          -      }
          -    },
          -    "node_modules/@carbon/icons-react": {
          -      "version": "11.90.0",
          -      "resolved": "https://registry.npmjs.org/@carbon/icons-react/-/icons-react-11.90.0.tgz",
          -      "integrity": "sha512-WcYBnIJNEuLXpNxibe1ltVe1HAsTDuGanRVdzRYK/gN+adayDmHplMnXXDNjNlwB4PjSKesqhvt7UAZlLs7uYg==",
          -      "hasInstallScript": true,
          -      "license": "Apache-2.0",
          -      "dependencies": {
          -        "@carbon/icon-helpers": "^10.84.0",
          -        "@ibm/telemetry-js": "^1.5.0",
          -        "prop-types": "^15.8.1"
          -      },
          -      "peerDependencies": {
          -        "react": ">=16"
          -      }
          -    },
          @@ -777,9 +751,0 @@
          -    "node_modules/@ibm/telemetry-js": {
          -      "version": "1.12.0",
          -      "resolved": "https://registry.npmjs.org/@ibm/telemetry-js/-/telemetry-js-1.12.0.tgz",
          -      "integrity": "sha512-tNgmk2k8loNDTnPInlu7yMP9YOCr9UMwSnXN7SCEsGIV8xHfTawhXlDnp1PV0Lbv+2GoLQKSgkShlJeGPi4jTg==",
          -      "license": "Apache-2.0",
          -      "bin": {
          -        "ibmtelemetry": "dist/collect.js"
          -      }
          -    },
          @@ -3690,0 +3657 @@
          +      "dev": true,
          @@ -4062,12 +4028,0 @@
          -    "node_modules/loose-envify": {
          -      "version": "1.4.0",
          -      "resolved": "https://registry.npmjs.org/loose-envify/-/loose-envify-1.4.0.tgz",
          -      "integrity": "sha512-lyuxPGr/Wfhrlem2CL/UcnUc1zcqKAImBDzukY7Y5F/yQiNdko6+fRLevlw1HgMySw7f611UIY408EtxRSoK3Q==",
          -      "license": "MIT",
          -      "dependencies": {
          -        "js-tokens": "^3.0.0 || ^4.0.0"
          -      },
          -      "bin": {
          -        "loose-envify": "cli.js"
          -      }
          -    },
          @@ -4083,0 +4039,15 @@
          +    "node_modules/lucide-react": {
          +      "version": "1.72.0",
          +      "resolved": "https://registry.npmjs.org/lucide-react/-/lucide-react-1.72.0.tgz",
          +      "integrity": "sha512-fbF5i1GU8GODETa3Q7rXqrJrcx3iPYrQtxthom103zGx+Z0BGwKYAW9s+9435ohYJ7hQm0av0PoZcqI1CRwNrg==",
          +      "license": "ISC",
          +      "peerDependencies": {
          +        "@types/react": "*",
          +        "react": "^16.5.1 || ^17.0.0 || ^18.0.0 || ^19.0.0"
          +      },
          +      "peerDependenciesMeta": {
          +        "@types/react": {
          +          "optional": true
          +        }
          +      }
          +    },
          @@ -4174,9 +4143,0 @@
          -    "node_modules/object-assign": {
          -      "version": "4.1.1",
          -      "resolved": "https://registry.npmjs.org/object-assign/-/object-assign-4.1.1.tgz",
          -      "integrity": "sha512-rJgTQnkUnH1sFw8yT6VSU3zD3sWmu6sZhIseY8VX+GRu3P6F7Fu+JNDoXfklElbLJSnc3FUQHVe4cU5hj+BcUg==",
          -      "license": "MIT",
          -      "engines": {
          -        "node": ">=0.10.0"
          -      }
          -    },
          @@ -4359,17 +4319,0 @@
          -    "node_modules/prop-types": {
          -      "version": "15.8.1",
          -      "resolved": "https://registry.npmjs.org/prop-types/-/prop-types-15.8.1.tgz",
          -      "integrity": "sha512-oj87CgZICdulUohogVAR7AjlC0327U4el4L6eAvOqCeudMDVU0NThNaV+b9Df4dXgSP1gXMTnPdhfe/2qDH5cg==",
          -      "license": "MIT",
          -      "dependencies": {
          -        "loose-envify": "^1.4.0",
          -        "object-assign": "^4.1.1",
          -        "react-is": "^16.13.1"
          -      }
          -    },
          -    "node_modules/prop-types/node_modules/react-is": {
          -      "version": "16.13.1",
          -      "resolved": "https://registry.npmjs.org/prop-types/-/prop-types-4.1.1.tgz",
          -      "integrity": "sha512-24e6ynE2H+OKt4kqsOvNd8kBpV65zoxbA4BVsEOB3ARVWQki/DHzaUoC5KuON/BiccDaCCTZBuOcfZs70kR8bQ==",
          -      "license": "MIT"
          -    },
          PATCH
          git apply --unidiff-zero /tmp/change.diff
          git add -A
          if [ "$(git write-tree)" != "d698da6c9de53a72655ed11d94573468370e816d" ]; then
            echo "The result does not match the reviewed tree. Nothing was pushed."
            git status --short
            exit 1
          fi
      - name: Commit only the reviewed result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ui): package-lock.json for lucide-react'
          git push origin HEAD:feat/new-look-base
